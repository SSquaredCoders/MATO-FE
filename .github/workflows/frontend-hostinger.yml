name: Frontend CI and Hostinger branch

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: frontend-hostinger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build for Hostinger
        run: npm run build:hostinger

      - name: Verify Hostinger output
        run: npm run verify:hostinger

      - name: Store verified Hostinger output
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/develop')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hostinger-client
          path: dist/client
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish hostinger-deploy
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified Hostinger output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hostinger-client
          path: dist/client

      - name: Confirm deployment payload
        run: |
          test -f dist/client/index.html
          test -f dist/client/.htaccess
          test -n "$(find dist/client/assets -type f -print -quit)"

      - name: Publish orphan deployment branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          deploy_dir="$(mktemp -d)"
          trap 'rm -rf "$deploy_dir"' EXIT

          cp -a dist/client/. "$deploy_dir"/
          diff -qr dist/client "$deploy_dir"

          git -C "$deploy_dir" init --initial-branch=hostinger-deploy
          git -C "$deploy_dir" config user.name "github-actions[bot]"
          git -C "$deploy_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$deploy_dir" config core.autocrlf false
          git -C "$deploy_dir" add --all --force
          git -C "$deploy_dir" commit -m "Deploy ${GITHUB_SHA}"
          git -C "$deploy_dir" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$deploy_dir" push --force origin HEAD:refs/heads/hostinger-deploy
